<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PeerLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f4fb;--sf:#fff;--sf2:#ece9f8;--tx:#1b2147;--mu:#636a8f;--ac:#1f2a6b;--ac2:#b9aef0;--ok:#1f8a5b;--wn:#b7791f;--bd:#e0ddf0;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1330;--sf:#181d45;--sf2:#232a5c;--tx:#eceaff;--mu:#9aa0cc;--ac:#b9aef0;--ac2:#3a3f8a;--ok:#55d19a;--wn:#f0b95a;--bd:#2c336b;--on:#14183a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1330;--sf:#181d45;--sf2:#232a5c;--tx:#eceaff;--mu:#9aa0cc;--ac:#b9aef0;--ac2:#3a3f8a;--ok:#55d19a;--wn:#f0b95a;--bd:#2c336b;--on:#14183a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'DM Sans',system-ui,sans-serif;height:100vh;display:flex}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
#nav{width:76px;background:var(--ac);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;flex:none}
#nav .logo{font:700 13px 'Bricolage Grotesque';color:var(--on);margin-bottom:4px;letter-spacing:.3px}
#nav .sp{flex:1}
.cir{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;transition:border-radius .2s,background .2s,transform .2s}
:root[data-theme="dark"] .cir,.dk .cir{color:var(--tx)}
.cir:hover{border-radius:18px;background:rgba(255,255,255,.28)}
.cir.on{background:var(--ac2);color:var(--ac);box-shadow:0 0 0 3px var(--ac),0 0 0 5px var(--ac2)}
.cir svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cir .tip{position:absolute;left:60px;background:var(--tx);color:var(--bg);padding:4px 10px;border-radius:8px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
.cir:hover .tip,.cir:focus-visible .tip{opacity:1}
.bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.av{width:40px;height:40px;border-radius:50%;background:var(--ac2);color:var(--ac);display:inline-grid;place-items:center;font-weight:600;flex:none}
#nav .av{border:2px solid var(--ac2);cursor:pointer;background:var(--sf);color:var(--ac)}
main{flex:1;overflow:auto;padding:26px 32px;min-width:0}
.demo{background:var(--sf2);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mu);margin-bottom:16px;display:inline-block}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hd p{margin:2px 0 0;color:var(--mu)}h1{font-size:28px}h2{font-size:19px;margin-bottom:10px}h3{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;color:var(--mu)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}
.btn{border:0;border-radius:999px;padding:8px 16px;background:var(--ac);color:var(--on);font-weight:600}
.btn.s{background:var(--sf2);color:var(--tx)}.btn.d{background:transparent;color:#e5484d;border:1px solid #e5484d}.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:9px 12px}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sf2);color:var(--mu);font-weight:600}
.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:5px 14px}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
form,.form{display:grid;gap:8px;margin-bottom:18px}.form.card{max-width:560px}
.ask{background:var(--ac);color:var(--on);border-radius:22px;padding:22px;margin-bottom:20px}
.ask h2{font-size:22px}.ask .in{border:0;color:#1b2147;background:#fff}
.split{display:grid;grid-template-columns:280px 1fr;gap:14px;height:calc(100vh - 200px);min-height:420px}
.list{overflow:auto;display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:1px solid transparent;background:var(--sf);text-align:left;width:100%}
.li.on{border-color:var(--ac2);background:var(--sf2)}
.pane{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--sf2);align-self:flex-start;cursor:pointer}
.m.me{align-self:flex-end;background:var(--ac);color:var(--on)}.m small{display:block;opacity:.7;font-size:12px}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu);display:inline-block}.dot.on{background:var(--ok)}
.empty{padding:36px;text-align:center;color:var(--mu);border:2px dashed var(--bd);border-radius:18px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
#mod{position:fixed;inset:0;background:rgba(10,12,40,.5);display:none;place-items:center;z-index:30}#mod.on{display:grid}
#mod div{background:var(--sf);padding:22px;border-radius:18px;max-width:340px}
@media(max-width:760px){body{flex-direction:column-reverse}#nav{width:100%;flex-direction:row;overflow-x:auto;padding:8px;justify-content:flex-start;gap:8px}#nav .logo,#nav .sp{display:none}.cir .tip{display:none}main{padding:18px 16px}.split{grid-template-columns:1fr;height:auto}.pane{min-height:380px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="nav" aria-label="Features"></nav><main id="main"></main><div id="toast" role="status"></div><div id="mod"><div id="mc"></div></div>
<script>
const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',comms:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M18 15c2 .6 3 2.2 3 5"/>',msgs:'<path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/>',study:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5"/>',assist:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/>',borrow:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',skills:'<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',res:'<path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',notes:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const NAV=[['home','Home'],['comms','Communities'],['msgs','Messages'],['study','Study Partners'],['assist','Peer Assistance'],['borrow','Borrow & Lend'],['skills','Skill Exchange'],['res','Resources'],['notes','Notifications']];
const S={v:'home',q:'',f:'All',tab:'ask',c:null,t:'t1',reply:null,
me:{name:'Mika Reyes',user:'mika.r',uni:'Batangas State University',course:'BS Computer Engineering, Year 2',bio:'Python tinkerer. Calculus survivor.',help:'Python, Arduino',need:'Differential Calculus',priv:true},
comms:[{id:1,n:'Computer Engineering Students',k:'Program',m:128,j:1,msgs:[['Ana','Anyone got the logic circuits lab sheet?']]},{id:2,n:'Differential Calculus',k:'Subject',m:96,j:0,msgs:[['Jon','Quiz 2 covers chain rule and implicit differentiation.']]},{id:3,n:'Chemistry for Engineers',k:'Subject',m:74,j:0,msgs:[]},{id:4,n:'Programming Beginners',k:'Interest',m:210,j:1,msgs:[['Lea','Start with small projects, not tutorials.']]},{id:5,n:'General Student Community',k:'University',m:540,j:0,msgs:[]},{id:6,n:'Academic Help Center',k:'University',m:312,j:0,msgs:[]}],
th:[{id:'t1',n:'Ana Cruz',on:1,u:2,msgs:[['Ana','Hi! Are you free to study tonight?'],['Ana','I can bring my notes.']]},{id:'t2',n:'Calculus Study Group',on:1,u:0,msgs:[['Jon','Sat 2pm at the library?']]},{id:'t3',n:'Paolo Lim',on:0,u:0,msgs:[['me','Thanks for the charger!']]}],
study:[{id:1,who:'Ana Cruz',s:'Differential Calculus',sch:'Mon & Wed evenings',mode:'Online',g:'2–3',st:0},{id:2,who:'Jon Bautista',s:'Data Structures',sch:'Weekends',mode:'Face-to-face',g:'3–4',st:0},{id:3,who:'Lea Santos',s:'Chemistry',sch:'Tue afternoons',mode:'Online',g:'2',st:0}],
req:[{id:1,who:'Ben Tan',s:'Mathematics',d:'Need help with limits at infinity.',ty:'Tutoring',sch:'Thu 4pm',mode:'Online',st:'Open',off:0},{id:2,who:'Mika Reyes',s:'Programming',d:'Debug my Python loop in a lab activity.',ty:'Debugging',sch:'Any evening',mode:'Online',st:'Open',off:0},{id:3,who:'Gia Ramos',s:'Physics',d:'Free-body diagrams review.',ty:'Review',sch:'Sat 10am',mode:'Face-to-face',st:'Matched',off:1}],
items:[{id:1,n:'Scientific calculator (fx-991)',o:'Paolo Lim',d:'Return within 2 days.',loc:'Engineering building lobby',st:'Available'},{id:2,n:'Breadboard & jumper kit',o:'Ana Cruz',d:'Please return complete.',loc:'Library entrance',st:'Available'},{id:3,n:'Laptop charger (USB-C)',o:'Jon Bautista',d:'Same-day return.',loc:'Canteen',st:'Borrowed'},{id:4,n:'Organic Chemistry book',o:'Lea Santos',d:'No highlighting.',loc:'Science hall',st:'Pending'}],
sk:[{id:1,who:'Ana Cruz',off:'Python',want:'Differential Calculus',av:'Weeknights',st:'Open'},{id:2,who:'Ben Tan',off:'Graphic design',want:'Programming basics',av:'Weekends',st:'Open'},{id:3,who:'Gia Ramos',off:'Video editing',want:'Physics help',av:'Fri afternoons',st:'Completed'}],
res:[{id:1,n:'Calculus limits cheat sheet',ty:'Notes',by:'Jon B.',b:0},{id:2,n:'Chemistry lab safety reviewer',ty:'Reviewer',by:'Lea S.',b:1},{id:3,n:'Python loops: 20 practice problems',ty:'Exercises',by:'Ana C.',b:0},{id:4,n:'Data structures study guide',ty:'Study guide',by:'Paolo L.',b:0}],
nt:[{id:1,t:'Ana Cruz sent you a message',v:'msgs',r:0},{id:2,t:'Ben Tan wants to borrow your breadboard kit',v:'borrow',r:0},{id:3,t:'Study session: Calculus, Sat 2pm',v:'study',r:0},{id:4,t:'New announcement in Programming Beginners',v:'comms',r:1}]};
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=n=>e(n.split(' ').map(x=>x[0]).join('').slice(0,2));
const val=id=>($('#'+id)?.value||'').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2200)}
function ask(msg,fn){$('#mc').innerHTML=`<h3>Are you sure?</h3><p>${e(msg)}</p><div class="row"><button class="btn" data-a="yes">Confirm</button><button class="btn s" data-a="no">Cancel</button></div>`;$('#mod').className='on';ask.fn=fn}
function note(t,v){S.nt.unshift({id:Date.now(),t,v,r:0})}
const badge=k=>k=='msgs'?S.th.reduce((a,x)=>a+x.u,0):k=='notes'?S.nt.filter(x=>!x.r).length:k=='assist'?S.req.filter(x=>x.st=='Open'&&x.who!=S.me.name).length:0;
const ic=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const hd=(t,d,x='')=>`<div class="hd"><div><h1>${t}</h1><p>${d}</p></div>${x}</div>`;
const srch=ph=>`<input class="in" id="q" placeholder="${ph}" value="${e(S.q)}" style="max-width:320px">`;
const chips=a=>`<div class="chips">${a.map(x=>`<button class="chip ${S.f==x?'on':''}" data-a="f" data-i="${x}">${x}</button>`).join('')}</div>`;
const match=(o,ks)=>(!S.q||ks.some(k=>String(o[k]).toLowerCase().includes(S.q.toLowerCase())));
const empty=t=>`<div class="empty">${t}</div>`;
const stc=s=>['Available','Open','Completed','Matched','Approved','Returned'].includes(s)?'ok':['Pending','Requested','Borrowed'].includes(s)?'wn':'';
const V={
home(){const o=S.req.filter(x=>x.who==S.me.name);return `<div class="ask"><h2>What do you need help with?</h2><p style="margin:0 0 12px;opacity:.85">Describe it and we’ll start a peer assistance request.</p><div class="row"><input class="in" id="hq" placeholder="e.g. Help with integration by parts" style="flex:1"><button class="btn" style="background:var(--ac2);color:var(--ac)" data-a="hq">Ask for help</button></div></div>
${hd('Hi, '+e(S.me.name.split(' ')[0]),e(S.me.course))}
<div class="chips">${NAV.slice(1,8).map(([k,n])=>`<button class="chip" data-a="go" data-i="${k}">${n}</button>`).join('')}</div>
<div class="grid"><div class="card"><h3>Recent conversations</h3>${S.th.map(t=>`<div class="row sb"><span>${e(t.n)}</span>${t.u?`<span class="tag">${t.u} new</span>`:''}</div>`).join('')}<button class="btn s" data-a="go" data-i="msgs">Open messages</button></div>
<div class="card"><h3>Your assistance requests</h3>${o.length?o.map(x=>`<div class="row sb"><span>${e(x.s)}</span><span class="tag ${stc(x.st)}">${x.st}</span></div>`).join(''):'<p>None yet.</p>'}</div>
<div class="card"><h3>Upcoming study session</h3><p>Differential Calculus with Ana, Mon 7pm (demo)</p></div>
<div class="card"><h3>Recommended communities</h3>${S.comms.filter(c=>!c.j).slice(0,3).map(c=>`<div class="row sb"><span>${e(c.n)}</span><button class="btn s" data-a="join" data-i="${c.id}">Join</button></div>`).join('')||'<p>You joined them all.</p>'}</div>
<div class="card"><h3>Recent resources</h3>${S.res.slice(0,3).map(r=>`<span>${e(r.n)}</span>`).join('')}</div></div>`},
comms(){if(S.c){const c=S.comms.find(x=>x.id==S.c);return `<button class="btn s" data-a="back">Back to communities</button><div class="hd" style="margin-top:14px"><div><h1>${e(c.n)}</h1><p>${c.m+c.j} members · ${c.k}</p></div></div>${c.j?`<div class="pane" style="height:60vh"><div class="msgs">${c.msgs.length?c.msgs.map(m=>`<div class="m ${m[0]=='me'?'me':''}"><small>${e(m[0]=='me'?'You':m[0])}</small>${e(m[1])}</div>`).join(''):empty('No posts yet. Start the discussion.')}</div><div class="send"><input class="in" id="cm" placeholder="Post to ${e(c.n)}"><button class="btn" data-a="cpost">Post</button></div></div>`:empty('Join this community to join the discussion.')}`}
return hd('Communities','Join groups by program, subject or interest.',srch('Search communities'))+chips(['All','Program','Subject','Interest','University'])+`<div class="form card"><h3>Create a community</h3><input class="in" id="cn" placeholder="Community name"><select class="in" id="ck"><option>Program</option><option>Subject</option><option>Interest</option><option>University</option></select><button class="btn" data-a="ccreate">Create community</button></div><div class="grid">${S.comms.filter(c=>(S.f=='All'||c.k==S.f)&&match(c,['n'])).map(c=>`<div class="card"><div class="row sb"><h3>${e(c.n)}</h3><span class="tag">${c.k}</span></div><p>${c.m+c.j} members</p><div class="row"><button class="btn" data-a="copen" data-i="${c.id}">Open</button><button class="btn ${c.j?'d':'s'}" data-a="join" data-i="${c.id}">${c.j?'Leave':'Join'}</button></div></div>`).join('')}</div>`},
msgs(){const t=S.th.find(x=>x.id==S.t);return hd('Messages','Chat one-on-one or with study groups.')+`<div class="split"><div><input class="in" id="q" placeholder="Search conversations" value="${e(S.q)}" style="margin-bottom:8px"><div class="list">${S.th.filter(x=>match(x,['n'])).map(x=>`<button class="li ${x.id==S.t?'on':''}" data-a="th" data-i="${x.id}"><span class="av">${ini(x.n)}</span><span style="flex:1">${e(x.n)}<br><small><span class="dot ${x.on?'on':''}"></span> ${x.on?'Online':'Offline'}</small></span>${x.u?`<span class="tag">${x.u}</span>`:''}</button>`).join('')||empty('No matches.')}</div><button class="btn s" style="margin-top:8px;width:100%" data-a="newth">New conversation</button></div>
<div class="pane"><div class="msgs">${t.msgs.map((m,i)=>`<div class="m ${m[0]=='me'?'me':''}" data-a="react" data-i="${i}"><small>${e(m[0]=='me'?'You':m[0])}</small>${m[2]?'<small>↩ '+e(m[2])+'</small>':''}${e(m[1])}${m[3]?' '+m[3]:''}</div>`).join('')}</div>${S.reply!=null?`<div class="send" style="padding:6px 10px"><small>Replying to: ${e(t.msgs[S.reply][1])}</small><button class="btn s" data-a="nr">×</button></div>`:''}<div class="send"><label class="btn s" title="Attach a file">📎<input type="file" id="fl" hidden></label><input class="in" id="mi" placeholder="Write a message. Tap a message to react."><button class="btn s" data-a="rep">Reply</button><button class="btn" data-a="send">Send</button></div></div></div>`},
study(){return hd('Study Partners','Find peers with matching subjects and schedules.',srch('Search subject or name'))+`<div class="form card"><h3>Create a listing</h3><input class="in" id="ss" placeholder="Subject or topic"><input class="in" id="sc" placeholder="Preferred schedule"><select class="in" id="sm"><option>Online</option><option>Face-to-face</option></select><select class="in" id="sg"><option>2</option><option>2–3</option><option>3–5</option></select><button class="btn" data-a="screate">Post listing</button></div><div class="grid">${S.study.filter(x=>match(x,['s','who'])).map(x=>`<div class="card"><div class="row"><span class="av">${ini(x.who)}</span><div><h3>${e(x.who)}</h3><p>${e(x.s)}</p></div></div><p>${e(x.sch)} · ${x.mode} · group of ${x.g}</p><button class="btn ${x.st?'s':''}" ${x.st?'disabled':''} data-a="sreq" data-i="${x.id}">${x.st?'Request sent':'Send connection request'}</button></div>`).join('')||empty('No listings match your search.')}</div>`},
assist(){const own=S.tab=='ask';return hd('Peer Assistance','Ask for help or offer yours.')+chips(['All','Open','Matched']).replace(/data-a="f"/g,'data-a="f"')+`<div class="chips"><button class="chip ${own?'on':''}" data-a="tab" data-i="ask">Ask for help</button><button class="chip ${!own?'on':''}" data-a="tab" data-i="offer">Offer help</button></div>`+(own?`<div class="form card"><h3>New request</h3><input class="in" id="as" placeholder="Subject or topic"><textarea class="in" id="ad" placeholder="Describe the problem" rows="3">${e(S.pre||'')}</textarea><select class="in" id="at"><option>Tutoring</option><option>Debugging</option><option>Review</option></select><input class="in" id="asch" placeholder="Preferred schedule"><select class="in" id="am"><option>Online</option><option>Face-to-face</option></select><button class="btn" data-a="acreate">Post request</button></div>`:'<p>Respond to an open request to arrange a session.</p>')+`<div class="grid">${S.req.filter(x=>(S.f=='All'||x.st==S.f)).map(x=>`<div class="card"><div class="row sb"><h3>${e(x.s)}</h3><span class="tag ${stc(x.st)}">${x.st}</span></div><p>${e(x.d)}</p><p>${e(x.who)} · ${x.ty} · ${e(x.sch)} · ${x.mode}</p>${x.st=='Open'&&x.who!=S.me.name?`<button class="btn" data-a="offer" data-i="${x.id}">I can help</button>`:''}</div>`).join('')}</div>`},
borrow(){return hd('Borrow & Lend','Share school items with fellow students.',srch('Search items'))+chips(['All','Available','Pending','Borrowed'])+`<div class="form card"><h3>List an item</h3><input class="in" id="bn" placeholder="Item name"><input class="in" id="bd" placeholder="Borrowing conditions"><input class="in" id="bl" placeholder="Pickup location"><button class="btn" data-a="bcreate">List item</button></div><div class="grid">${S.items.filter(x=>(S.f=='All'||x.st==S.f)&&match(x,['n','o'])).map(x=>`<div class="card"><div class="row sb"><h3>${e(x.n)}</h3><span class="tag ${stc(x.st)}">${x.st}</span></div><p>Owner: ${e(x.o)}</p><p>${e(x.d)} Pickup: ${e(x.loc)}</p>${x.o==S.me.name?(x.st=='Pending'?`<div class="row"><button class="btn" data-a="bok" data-i="${x.id}">Approve</button><button class="btn d" data-a="bno" data-i="${x.id}">Decline</button></div>`:x.st=='Borrowed'?`<button class="btn s" data-a="bret" data-i="${x.id}">Mark returned</button>`:''):`<button class="btn s" ${x.st!='Available'?'disabled':''} data-a="breq" data-i="${x.id}">Request to borrow</button>`}</div>`).join('')||empty('No items found.')}</div>`},
skills(){return hd('Skill Exchange','Trade what you know for what you need.',srch('Search skills'))+`<div class="form card"><h3>Post an exchange</h3><input class="in" id="ko" placeholder="Skill you offer"><input class="in" id="kw" placeholder="Skill you want"><input class="in" id="ka" placeholder="Availability"><button class="btn" data-a="kcreate">Post exchange</button></div><div class="grid">${S.sk.filter(x=>match(x,['off','want','who'])).map(x=>`<div class="card"><div class="row sb"><h3>${e(x.who)}</h3><span class="tag ${stc(x.st)}">${x.st}</span></div><p>Offers <b>${e(x.off)}</b><br>Wants <b>${e(x.want)}</b></p><p>${e(x.av)}</p><button class="btn s" ${x.st!='Open'?'disabled':''} data-a="kreq" data-i="${x.id}">Request exchange</button></div>`).join('')||empty('Nothing matches.')}</div>`},
res(){return hd('Resources','Notes, reviewers and guides shared by students.',srch('Search resources'))+chips(['All','Notes','Reviewer','Exercises','Study guide','Saved'])+`<div class="form card"><h3>Share a resource</h3><input class="in" id="rn" placeholder="Title"><select class="in" id="rt"><option>Notes</option><option>Reviewer</option><option>Exercises</option><option>Study guide</option></select><button class="btn" data-a="rcreate">Upload resource</button></div><div class="grid">${S.res.filter(x=>(S.f=='All'||(S.f=='Saved'?x.b:x.ty==S.f))&&match(x,['n'])).map(x=>`<div class="card"><h3>${e(x.n)}</h3><p>${x.ty} · by ${e(x.by)}</p><div class="row"><button class="btn s" data-a="rdl" data-i="${x.id}">Download</button><button class="btn s" data-a="rbm" data-i="${x.id}">${x.b?'★ Saved':'☆ Save'}</button><button class="btn d" data-a="rrep" data-i="${x.id}">Report</button></div></div>`).join('')||empty('No resources yet.')}</div>`},
notes(){return hd('Notifications','Requests, replies and reminders.',`<button class="btn s" data-a="readall">Mark all read</button>`)+`<div class="list" style="max-width:640px">${S.nt.map(n=>`<button class="li ${n.r?'':'on'}" data-a="nt" data-i="${n.id}"><span style="flex:1">${e(n.t)}</span>${n.r?'':'<span class="tag">New</span>'}</button>`).join('')||empty('You are all caught up.')}</div>`},
me(){const m=S.me;return hd('Your profile','Manage how others see you.')+`<div class="form card"><div class="row"><span class="av">${ini(m.name)}</span><div><h3>${e(m.name)}</h3><p>@${e(m.user)} · ${e(m.uni)}</p></div></div><input class="in" id="pn" value="${e(m.name)}" aria-label="Display name"><input class="in" id="pc" value="${e(m.course)}" aria-label="Course"><textarea class="in" id="pb" aria-label="Bio">${e(m.bio)}</textarea><input class="in" id="ph" value="${e(m.help)}" aria-label="Can help with"><input class="in" id="pd" value="${e(m.need)}" aria-label="Needs help with"><label class="row"><input type="checkbox" id="pp" ${m.priv?'checked':''}> Show my profile only to students in my communities</label><button class="btn" data-a="psave">Save profile</button><div class="row"><button class="btn d" data-a="block">Block a user</button><button class="btn s" data-a="theme">Switch theme</button></div></div>`}};
function render(){$('#nav').innerHTML=`<div class="logo">PeerLink</div>`+NAV.map(([k,n])=>{const b=badge(k);return `<button class="cir ${S.v==k?'on':''}" data-a="go" data-i="${k}" aria-label="${n}" ${S.v==k?'aria-current="page"':''}>${ic(k)}<span class="tip">${n}</span>${b?`<span class="bdg">${b}</span>`:''}</button>`}).join('')+`<div class="sp"></div><button class="cir" data-a="go" data-i="me" aria-label="Settings">${ic('set')}<span class="tip">Settings</span></button><span class="av" data-a="go" data-i="me" role="button" tabindex="0" aria-label="Your profile">${ini(S.me.name)}</span>`;
$('#main').innerHTML='<span class="demo">Demo mode: sample data only, nothing is saved or sent to real students.</span>'+V[S.v]();const m=$('.msgs');if(m)m.scrollTop=1e5}
function go(v){S.v=v;S.q='';S.f='All';S.c=null;render();$('#main').scrollTop=0}
document.addEventListener('input',ev=>{if(ev.target.id=='q'){S.q=ev.target.value;const p=ev.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'){const i=ev.target.id;if(i=='mi')A.send();if(i=='cm')A.cpost();if(i=='hq')A.hq()}if(ev.key=='Enter'&&ev.target.getAttribute('role')=='button')ev.target.click()});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i||b.dataset.i;if(a=='yes'){$('#mod').className='';ask.fn&&ask.fn();return}if(a=='no'){$('#mod').className='';return}A[a]&&A[a](i);});
const A={go,back(){S.c=null;render()},f(i){S.f=i;render()},tab(i){S.tab=i;render()},
hq(){S.pre=val('hq');S.tab='ask';go('assist');S.pre='';if(!$('#ad').value)$('#ad').value=''},
join(i){const c=S.comms.find(x=>x.id==i);if(c.j)return ask('Leave '+c.n+'?',()=>{c.j=0;render();toast('Left community')});c.j=1;render();toast('Joined '+c.n)},
copen(i){S.c=i;render()},cpost(){const c=S.comms.find(x=>x.id==S.c),t=val('cm');if(!t)return toast('Write something first');c.msgs.push(['me',t]);render()},
ccreate(){const n=val('cn');if(n.length<3)return toast('Give the community a name (3+ letters)');S.comms.unshift({id:Date.now(),n,k:$('#ck').value,m:0,j:1,msgs:[]});render();toast('Community created')},
th(i){S.t=i;S.th.find(x=>x.id==i).u=0;S.reply=null;render()},newth(){const n=prompt?null:null;const nm='New peer '+(S.th.length+1);S.th.push({id:'t'+Date.now(),n:nm,on:1,u:0,msgs:[]});S.t=S.th[S.th.length-1].id;render();toast('Conversation started')},
send(){const t=S.th.find(x=>x.id==S.t),x=val('mi'),f=$('#fl')?.files[0];if(!x&&!f)return toast('Write a message or attach a file');t.msgs.push(['me',(f?'📎 '+f.name+(x?' — ':''):'')+x,S.reply!=null?t.msgs[S.reply][1].slice(0,40):null]);S.reply=null;render();setTimeout(()=>{if(S.t==t.id&&S.v=='msgs'){t.msgs.push([t.n.split(' ')[0],'Got it, thanks! (auto-reply in demo)']);render()}},900)},
rep(){if(!S.th.find(x=>x.id==S.t).msgs.length)return;S.reply=S.th.find(x=>x.id==S.t).msgs.length-1;render();toast('Replying to last message')},nr(){S.reply=null;render()},
react(i){const m=S.th.find(x=>x.id==S.t).msgs[i];m[3]=m[3]?'':'👍';render()},
screate(){const s=val('ss');if(!s)return toast('Add a subject');S.study.unshift({id:Date.now(),who:S.me.name,s,sch:val('sc')||'Flexible',mode:$('#sm').value,g:$('#sg').value,st:1});render();toast('Listing posted')},
sreq(i){const x=S.study.find(y=>y.id==i);x.st=1;render();toast('Request sent to '+x.who)},
acreate(){const s=val('as'),d=val('ad');if(!s||!d)return toast('Add a subject and description');S.req.unshift({id:Date.now(),who:S.me.name,s,d,ty:$('#at').value,sch:val('asch')||'Flexible',mode:$('#am').value,st:'Open'});render();toast('Request posted')},
offer(i){const x=S.req.find(y=>y.id==i);x.st='Matched';note('You offered to help '+x.who+' with '+x.s,'assist');render();toast('Matched! Arrange a session in Messages')},
bcreate(){const n=val('bn');if(!n)return toast('Name the item');S.items.unshift({id:Date.now(),n,o:S.me.name,d:val('bd')||'Ask me first.',loc:val('bl')||'To be arranged',st:'Available'});render();toast('Item listed')},
breq(i){const x=S.items.find(y=>y.id==i);x.st='Pending';render();toast('Request sent to '+x.o)},
bok(i){S.items.find(y=>y.id==i).st='Borrowed';render();toast('Approved')},bno(i){ask('Decline this request?',()=>{S.items.find(y=>y.id==i).st='Available';render()})},bret(i){S.items.find(y=>y.id==i).st='Available';render();toast('Marked returned')},
kcreate(){const o=val('ko'),w=val('kw');if(!o||!w)return toast('Add both skills');S.sk.unshift({id:Date.now(),who:S.me.name,off:o,want:w,av:val('ka')||'Flexible',st:'Open'});render();toast('Exchange posted')},
kreq(i){const x=S.sk.find(y=>y.id==i);x.st='Requested';render();toast('Request sent to '+x.who)},
rcreate(){const n=val('rn');if(!n)return toast('Add a title');S.res.unshift({id:Date.now(),n,ty:$('#rt').value,by:'You',b:0});render();toast('Resource shared')},
rbm(i){const x=S.res.find(y=>y.id==i);x.b=x.b?0:1;render()},rdl(i){toast('Download starts in the live version')},rrep(i){ask('Report this resource as inappropriate or unauthorized?',()=>toast('Report submitted to moderators'))},
nt(i){const n=S.nt.find(x=>x.id==i);n.r=1;go(n.v)},readall(){S.nt.forEach(n=>n.r=1);render()},
psave(){const m=S.me;m.name=val('pn')||m.name;m.course=val('pc');m.bio=val('pb');m.help=val('ph');m.need=val('pd');m.priv=$('#pp').checked;render();toast('Profile saved')},
block(){ask('Block a user? They won’t be able to message you.',()=>toast('Demo: no users to block yet'))},
theme(){const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark');r.dataset.theme=d?'light':'dark';render()}};
render();
</script></body></html>
